version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    schedule:
      interval: "daily"
    groups:
      uv-dependencies:
        dependency-type: "production"
      uv-dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "daily"
    groups:
      docker:
        patterns:
          - "*"
